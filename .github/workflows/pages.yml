name: Deploy AURORA Dashboard Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout published site
        uses: actions/checkout@v5

      - name: Detect deployable content
        id: site
        run: |
          set -euo pipefail
          if test -s index.html && test -s deployment.json && test -s india/index.html && test -s canada/index.html; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Published dashboard content has not reached this repository yet."
          fi

      - name: Verify deployment receipt
        if: steps.site.outputs.ready == 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt = JSON.parse(fs.readFileSync("deployment.json", "utf8"));
          if (receipt.deployment_run_id !== "30841161722") {
            throw new Error(`Unexpected source run: ${receipt.deployment_run_id}`);
          }
          for (const market of ["india", "canada"]) {
            if (receipt.markets?.[market]?.status !== "PUBLISHED") {
              throw new Error(`${market} not published`);
            }
          }
          NODE

      - name: Configure GitHub Pages
        if: steps.site.outputs.ready == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload published site
        if: steps.site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        if: steps.site.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

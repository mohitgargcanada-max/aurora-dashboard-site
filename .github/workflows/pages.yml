name: Deploy AURORA Dashboard Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - "assets/**"
      - "deployments/**"
      - "deployment.json"
      - "deployment-source.json"
      - "us/**"
      - "india/**"
      - "canada/**"
      - "markets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public-site repository
        uses: actions/checkout@v5

      - name: Materialize current public site
        id: materialize
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          if [[ -s index.html && -s deployment.json ]]; then
            echo "Using repository-native independent market publication."
            shopt -s dotglob nullglob
            for entry in * .nojekyll; do
              [[ "$entry" == ".git" || "$entry" == ".github" || "$entry" == "README.md" || "$entry" == "deployment-source.json" || "$entry" == "ops" || "$entry" == "site" ]] && continue
              [[ -e "$entry" ]] || continue
              cp -a "$entry" site/
            done
            echo "mode=repository" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Repository-native site not bootstrapped yet; using legacy transfer manifest."
          test -s deployment-source.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("deployment-source.json", "utf8"));
          for (const field of ["artifact_url", "artifact_sha256", "source_run_id"]) {
            if (!manifest[field]) throw new Error(`Missing transfer field: ${field}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_url=${manifest.artifact_url}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_sha256=${manifest.artifact_sha256}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_run_id=${manifest.source_run_id}\n`);
          NODE

          artifact_url="$(node -p "JSON.parse(require('fs').readFileSync('deployment-source.json','utf8')).artifact_url")"
          artifact_sha256="$(node -p "JSON.parse(require('fs').readFileSync('deployment-source.json','utf8')).artifact_sha256")"
          echo "::add-mask::${artifact_url}"
          curl --location --fail --silent --show-error --retry 3 --retry-delay 2 \
            "$artifact_url" -o "$RUNNER_TEMP/aurora-public-site.zip"
          echo "${artifact_sha256}  $RUNNER_TEMP/aurora-public-site.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/aurora-public-site.zip" -d site
          echo "mode=legacy" >> "$GITHUB_OUTPUT"

      - name: Verify deployable site
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/deployment.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt = JSON.parse(fs.readFileSync("site/deployment.json", "utf8"));
          const markets = receipt.markets ?? {};
          const published = [];
          for (const market of ["us", "india", "canada"]) {
            const row = markets[market];
            if (row?.status !== "PUBLISHED") continue;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(String(row.completed_session ?? ""))) {
              throw new Error(`${market} published receipt has invalid completed session`);
            }
            if (!fs.existsSync(`site/${market}/index.html`)) {
              throw new Error(`${market} published receipt has no market index`);
            }
            published.push(market);
          }
          if (published.length === 0) throw new Error("No independently published market is available");
          console.log(`Publishing last-good markets: ${published.join(", ")}`);
          NODE

      - name: Upload published site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

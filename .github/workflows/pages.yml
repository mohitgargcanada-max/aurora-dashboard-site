name: Deploy AURORA Dashboard Site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  RELEASE_TAG: aurora-site-30841161722
  RELEASE_ASSET: aurora-public-site.zip

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download stable published-site release asset
        run: |
          set -euo pipefail
          mkdir -p site
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${RELEASE_ASSET}"
          curl --location --fail --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "$asset_url" -o "$RUNNER_TEMP/${RELEASE_ASSET}"
          unzip -q "$RUNNER_TEMP/${RELEASE_ASSET}" -d site
          test -s site/index.html
          test -s site/deployment.json
          test -s site/india/index.html
          test -s site/canada/index.html

      - name: Verify deployment receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt = JSON.parse(fs.readFileSync("site/deployment.json", "utf8"));
          if (receipt.deployment_run_id !== "30841161722") {
            throw new Error(`Unexpected source run: ${receipt.deployment_run_id}`);
          }
          for (const market of ["india", "canada"]) {
            if (receipt.markets?.[market]?.status !== "PUBLISHED") {
              throw new Error(`${market} not published`);
            }
          }
          if (receipt.markets?.us?.status === "PUBLISHED") {
            throw new Error("US must remain excluded until reconciliation passes");
          }
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload published site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

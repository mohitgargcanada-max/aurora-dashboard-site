name: Deploy AURORA Dashboard Site

on:
  push:
    branches: [main]
    paths:
      - "deployment-source.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment manifest
        uses: actions/checkout@v5

      - name: Read transfer manifest
        id: transfer
        run: |
          set -euo pipefail
          test -s deployment-source.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const manifest = JSON.parse(fs.readFileSync("deployment-source.json", "utf8"));
          for (const field of ["artifact_url", "artifact_sha256", "source_run_id"]) {
            if (!manifest[field]) throw new Error(`Missing transfer field: ${field}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_url=${manifest.artifact_url}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_sha256=${manifest.artifact_sha256}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `source_run_id=${manifest.source_run_id}\n`);
          NODE

      - name: Download validated private artifact
        env:
          ARTIFACT_URL: ${{ steps.transfer.outputs.artifact_url }}
          ARTIFACT_SHA256: ${{ steps.transfer.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          echo "::add-mask::${ARTIFACT_URL}"
          mkdir -p site
          curl --location --fail --silent --show-error --retry 3 --retry-delay 2 \
            "${ARTIFACT_URL}" -o "$RUNNER_TEMP/aurora-public-site.zip"
          echo "${ARTIFACT_SHA256}  $RUNNER_TEMP/aurora-public-site.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/aurora-public-site.zip" -d site
          test -s site/index.html
          test -s site/deployment.json
          test -s site/india/index.html
          test -s site/canada/index.html

      - name: Verify deployment receipt
        env:
          SOURCE_RUN_ID: ${{ steps.transfer.outputs.source_run_id }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt = JSON.parse(fs.readFileSync("site/deployment.json", "utf8"));
          if (receipt.deployment_run_id !== process.env.SOURCE_RUN_ID) {
            throw new Error(`Unexpected source run: ${receipt.deployment_run_id}`);
          }
          for (const market of ["india", "canada"]) {
            if (receipt.markets?.[market]?.status !== "PUBLISHED") {
              throw new Error(`${market} not published`);
            }
          }
          if (receipt.markets?.us?.status === "PUBLISHED") {
            throw new Error("US must remain excluded until reconciliation passes");
          }
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload published site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

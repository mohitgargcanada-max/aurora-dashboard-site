name: Deploy AURORA Dashboard Site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - "assets/**"
      - "deployments/**"
      - "deployment.json"
      - "deployment-source.json"
      - "us/**"
      - "india/**"
      - "canada/**"
      - "markets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready: ${{ steps.materialize.outputs.ready }}
    steps:
      - name: Checkout public-site repository
        uses: actions/checkout@v5

      - name: Materialize current public site
        id: materialize
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          if [[ -s index.html && -s deployment.json ]]; then
            echo "Using repository-native independent market publication."
            shopt -s dotglob nullglob
            for entry in * .nojekyll; do
              [[ "$entry" == ".git" || "$entry" == ".github" || "$entry" == "README.md" || "$entry" == "deployment-source.json" || "$entry" == "ops" || "$entry" == "site" ]] && continue
              [[ -e "$entry" ]] || continue
              cp -a "$entry" site/
            done
            {
              echo "mode=repository"
              echo "ready=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The legacy transfer manifest used a short-lived artifact URL and may
          # now be expired. During the cutover, absence of repository-native site
          # content means there is simply nothing new to deploy. Exit cleanly and
          # preserve the currently served Pages deployment until the first
          # independent market publisher bootstraps this repository.
          echo "Independent public site has not been bootstrapped yet; preserving current live Pages deployment."
          {
            echo "mode=bootstrap-pending"
            echo "ready=false"
          } >> "$GITHUB_OUTPUT"

      - name: Verify deployable site
        if: steps.materialize.outputs.ready == 'true'
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/deployment.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt = JSON.parse(fs.readFileSync("site/deployment.json", "utf8"));
          const markets = receipt.markets ?? {};
          const published = [];
          for (const market of ["us", "india", "canada"]) {
            const row = markets[market];
            if (row?.status !== "PUBLISHED") continue;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(String(row.completed_session ?? ""))) {
              throw new Error(`${market} published receipt has invalid completed session`);
            }
            if (!fs.existsSync(`site/${market}/index.html`)) {
              throw new Error(`${market} published receipt has no market index`);
            }
            published.push(market);
          }
          if (published.length === 0) throw new Error("No independently published market is available");
          console.log(`Publishing last-good markets: ${published.join(", ")}`);
          NODE

      - name: Upload published site
        if: steps.materialize.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Bootstrap status
        if: steps.materialize.outputs.ready != 'true'
        run: echo "No repository-native market payload yet; existing Pages deployment remains untouched."

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

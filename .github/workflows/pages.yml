name: Deploy AURORA Dashboard Site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download completed India and Canada site
        run: |
          set -euo pipefail
          mkdir -p site
          curl --location --fail --show-error --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-1634-822f-bc33-4b063e02197e/raw?se=2026-08-03T19:30:00Z&sp=r&sv=2026-02-06&sr=b&scid=be66648c-adff-5899-92c4-ea911c9cf265&skoid=2757bbe4-5137-4324-975b-acedc0bad279&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T19:21:25Z&ske=2026-08-04T19:21:25Z&sks=b&skv=2026-02-06&sig=d%2BYyVz34d2VuaO%2B2xRFZdiN007Bh97j8fRnyStok0Mc%3D' -o site.zip
          unzip -q site.zip -d site
          test -s site/index.html
          test -s site/deployment.json
          test -s site/india/index.html
          test -s site/canada/index.html

      - name: Verify deployment receipt
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const receipt = JSON.parse(fs.readFileSync("site/deployment.json", "utf8"));
          if (receipt.deployment_run_id !== "30841161722") throw new Error(`Unexpected source run: ${receipt.deployment_run_id}`);
          for (const market of ["india", "canada"]) {
            if (receipt.markets?.[market]?.status !== "PUBLISHED") throw new Error(`${market} not published`);
          }
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload published site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

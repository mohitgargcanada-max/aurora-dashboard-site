name: Record AURORA Pages Status

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/record-pages-status.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/record-pages-status.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: aurora-pages-status-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_SHA: d10b957ec0fd20b2a62a0eba4f520fec6f07fc78
      SITE_URL: https://mohitgargcanada-max.github.io/aurora-dashboard-site/
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Observe existing Pages run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth=(
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          runs_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/runs?branch=main&per_page=20"
          run_id=""
          run_status=""
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error "${auth[@]}" "$runs_api" -o "$RUNNER_TEMP/pages-runs.json"
            readarray -t selected < <(node --input-type=module <<'NODE'
          import fs from "node:fs";
          const payload = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pages-runs.json`, "utf8"));
          const run = (payload.workflow_runs || []).find(row => row.head_sha === process.env.TARGET_SHA);
          if (run) {
            console.log(String(run.id));
            console.log(String(run.status || "unknown"));
          }
          NODE
            )
            run_id="${selected[0]:-}"
            run_status="${selected[1]:-}"
            if [ -n "$run_id" ] && [ "$run_status" = "completed" ]; then
              break
            fi
            sleep 15
          done

          if [ -n "$run_id" ]; then
            curl --fail --silent --show-error "${auth[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              -o "$RUNNER_TEMP/pages-run.json"
            curl --fail --silent --show-error "${auth[@]}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              -o "$RUNNER_TEMP/pages-jobs.json"
          else
            printf '%s\n' '{}' > "$RUNNER_TEMP/pages-run.json"
            printf '%s\n' '{"jobs":[]}' > "$RUNNER_TEMP/pages-jobs.json"
          fi

          site_http_status="$(curl --location --silent --show-error --output "$RUNNER_TEMP/site-index.html" --write-out '%{http_code}' "$SITE_URL" || true)"
          deployment_http_status="$(curl --location --silent --show-error --output "$RUNNER_TEMP/live-deployment.json" --write-out '%{http_code}' "${SITE_URL}deployment.json" || true)"

          mkdir -p ops
          RUN_ID="$run_id" SITE_HTTP_STATUS="$site_http_status" DEPLOYMENT_HTTP_STATUS="$deployment_http_status" node --input-type=module <<'NODE'
          import fs from "node:fs";
          const run = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pages-run.json`, "utf8"));
          const jobsPayload = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/pages-jobs.json`, "utf8"));
          let liveReceipt = null;
          try {
            liveReceipt = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/live-deployment.json`, "utf8"));
          } catch {}
          const status = {
            schema_version: "aurora_pages_deployment_status_v1",
            checked_at: new Date().toISOString(),
            target_sha: process.env.TARGET_SHA,
            workflow_run: process.env.RUN_ID ? {
              id: Number(process.env.RUN_ID),
              html_url: run.html_url || null,
              status: run.status || null,
              conclusion: run.conclusion || null,
              run_number: run.run_number || null,
              run_attempt: run.run_attempt || null,
              created_at: run.created_at || null,
              updated_at: run.updated_at || null,
            } : {
              id: null,
              status: "NOT_FOUND",
              conclusion: null,
            },
            jobs: (jobsPayload.jobs || []).map(job => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              html_url: job.html_url || null,
              steps: (job.steps || []).map(step => ({
                name: step.name,
                status: step.status,
                conclusion: step.conclusion,
              })),
            })),
            live_site: {
              url: process.env.SITE_URL,
              index_http_status: Number(process.env.SITE_HTTP_STATUS || 0),
              deployment_receipt_http_status: Number(process.env.DEPLOYMENT_HTTP_STATUS || 0),
              deployment_receipt: liveReceipt,
            },
          };
          fs.writeFileSync("ops/pages-deployment-status.json", `${JSON.stringify(status, null, 2)}\n`);
          console.log(JSON.stringify(status, null, 2));
          NODE

      - name: Upload observation
        uses: actions/upload-artifact@v4
        with:
          name: aurora-pages-observation-${{ github.run_id }}
          path: ops/pages-deployment-status.json
          if-no-files-found: error
          retention-days: 7

      - name: Record observation
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/pages-deployment-status.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ops: record Pages deployment status"
          git push
